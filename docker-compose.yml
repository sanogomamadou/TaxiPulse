services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    depends_on:
      - azurite
    environment:
      ACCEPT_EULA: "Y"
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    ports:
      - "5672:5672"
      # 9092 (Kafka-compatible) is exposed by the image but not published here:
      # the pipeline's spark-sql-kafka connector couldn't reach it from the
      # host in local testing - see pipeline/src/taxipulse_pipeline/main.py's
      # docstring and CLAUDE.md.
    volumes:
      - ./infra/local/eventhubs-emulator-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
