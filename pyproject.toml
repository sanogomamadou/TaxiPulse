[project]
name = "taxipulse"
version = "0.1.0"
description = "End-to-end real-time urban mobility data platform on Azure, built on NYC TLC trip data"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "pyarrow>=16.0",
  "pandas>=2.2",
  "requests>=2.32",
  "azure-eventhub>=5.11",
  "azure-identity>=1.17",
  "pyspark>=3.5",
  "delta-spark>=3.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "geopandas>=1.0",
  "prophet>=1.1",
  "mlflow>=2.14",
  # delta-rs bindings, not pyspark/delta-spark - the API reads already-
  # materialized Delta tables and shouldn't spin up a JVM/Spark session
  # per request just to serve them.
  "deltalake[pyarrow]>=0.18",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
  "httpx>=0.27",
]
airflow = [
  # Pinned exactly (not >=) - apache-airflow's own constraints file is
  # version-specific, and resolving against an unpinned range makes pip
  # consider newer Airflow versions whose constraints conflict with this
  # one's. Install with:
  #   pip install -e ".[airflow]" --constraint \
  #     https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt
  "apache-airflow==2.9.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "common/src",
  "replayer/src",
  "pipeline/src",
  "warehouse/src",
  "api/src",
  "scripts",
  "orchestration/dags",
]
exclude = ["data", ".venv", ".venv-airflow", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["taxipulse_common", "taxipulse_replayer", "taxipulse_pipeline", "taxipulse_warehouse", "taxipulse_api"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "replayer/tests", "pipeline/tests", "warehouse/tests", "api/tests", "orchestration/tests"]
pythonpath = [
  "common/src",
  "replayer/src",
  "pipeline/src",
  "warehouse/src",
  "api/src",
]
addopts = "-ra -q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This root pyproject.toml only exists to centralize dependency management and
# tool config (ruff, pytest) across the monorepo's components. It is not itself
# an installable package - each component under */src is added to sys.path via
# pytest's `pythonpath` above instead.
packages = []
