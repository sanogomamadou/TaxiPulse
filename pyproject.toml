[project]
name = "taxipulse"
version = "0.1.0"
description = "End-to-end real-time urban mobility data platform on GCP, built on NYC TLC trip data"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "pyarrow>=16.0",
  "pandas>=2.2",
  "requests>=2.32",
  "google-cloud-pubsub>=2.21",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.16",
  "apache-beam[gcp]>=2.57",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
  "httpx>=0.27",
]
airflow = [
  "apache-airflow>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "common/src",
  "replayer/src",
  "pipeline/src",
  "api/src",
  "scripts",
  "orchestration/dags",
]
exclude = ["data", ".venv", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["taxipulse_common", "taxipulse_replayer", "taxipulse_pipeline", "taxipulse_api"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "replayer/tests", "pipeline/tests", "api/tests", "orchestration/tests"]
pythonpath = [
  "common/src",
  "replayer/src",
  "pipeline/src",
  "api/src",
]
addopts = "-ra -q"
# Beam test helpers (TestPipeline, TestStream, ...) are classes named "Test*"
# that pytest tries (and fails) to collect as test classes; this repo only
# uses function-style tests, so silence that cosmetic warning.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This root pyproject.toml only exists to centralize dependency management and
# tool config (ruff, pytest) across the monorepo's components. It is not itself
# an installable package - each component under */src is added to sys.path via
# pytest's `pythonpath` above instead.
packages = []
